<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Shared itinerary — Itinera</title>
<meta name="description" content="A trip itinerary shared from Itinera. Open it in the app to copy it into your own trips.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F6FAF2; --surface:#FFFFFF; --surface-2:#EEF5E7; --text:#142019; --muted:#4A5B4D;
    --accent:#0B7669; --accent-ink:#FFFFFF; --accent-soft:#BFEBE2; --accent-soft-ink:#0A3A33; --border:#D6E4CB;
    --shadow:0 1px 2px rgba(20,32,25,.06), 0 8px 24px rgba(20,32,25,.08); color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#080808; --surface:#121314; --surface-2:#1A1B1D; --text:#EDEEF0; --muted:#A4A8AE;
      --accent:#70D6C5; --accent-ink:#00332D; --accent-soft:#0E4A43; --accent-soft-ink:#CFF5EC; --border:#26282B;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.45); color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Manrope',system-ui,sans-serif; line-height:1.5; }
  main { max-width:640px; margin:0 auto; padding:24px 16px 120px; }
  .brand { font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:var(--accent); margin-bottom:16px; }
  .cover { width:100%; height:200px; object-fit:cover; border-radius:20px; background:var(--surface-2); box-shadow:var(--shadow); }
  h1 { font-family:'Fraunces',serif; font-weight:600; font-size:30px; line-height:1.15; margin:18px 0 6px; }
  .meta { color:var(--muted); font-size:14px; margin-bottom:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px; }
  .chip { background:var(--accent-soft); color:var(--accent-soft-ink); font-weight:700; font-size:13px; padding:5px 12px; border-radius:999px; }
  .desc { margin:14px 0 4px; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin:26px 0 8px; }
  .stop { display:flex; gap:12px; padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:8px; }
  .time { min-width:46px; color:var(--muted); font-size:13px; font-weight:700; padding-top:2px; }
  .stop-title { font-weight:700; }
  .stop-loc { color:var(--muted); font-size:13px; }
  .leg { color:var(--muted); font-size:14px; padding:6px 4px; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--border); }
  .bar-inner { max-width:640px; margin:0 auto; display:flex; gap:10px; }
  .btn { flex:1; text-align:center; text-decoration:none; font-weight:800; padding:14px 16px; border-radius:999px; border:1.5px solid var(--accent); color:var(--accent); font-size:15px; }
  .btn.primary { background:var(--accent); color:var(--accent-ink); }
  .note { color:var(--muted); font-size:12px; margin-top:28px; }
  .state { text-align:center; padding:60px 0; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="brand">Itinera</div>
  <div id="root" class="state">Loading itinerary…</div>
</main>
<div class="bar" id="bar" hidden>
  <div class="bar-inner">
    <a class="btn" href="/get">Get the app</a>
    <a class="btn primary" id="open" href="#">Open in Itinera</a>
  </div>
</div>
<script>
(function () {
  var PROJECT = 'itinera-ae020';
  var root = document.getElementById('root');
  var id = (location.pathname.split('/').filter(Boolean)[1] || '').trim();
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fail(msg) { root.className = 'state'; root.textContent = msg; }
  // Firestore REST returns typed values; flatten them into plain JS.
  function val(v) {
    if (v == null) return null;
    if ('stringValue' in v) return v.stringValue;
    if ('integerValue' in v) return Number(v.integerValue);
    if ('doubleValue' in v) return v.doubleValue;
    if ('booleanValue' in v) return v.booleanValue;
    if ('arrayValue' in v) return (v.arrayValue.values || []).map(val);
    if ('mapValue' in v) { var o = {}, f = v.mapValue.fields || {}; for (var k in f) o[k] = val(f[k]); return o; }
    return null;
  }
  var LABELS = { MID_RANGE: 'Mid-range', BUDGET: 'Budget', LUXURY: 'Luxury', RELAXED: 'Relaxed', BALANCED: 'Balanced', PACKED: 'Packed' };
  var MODE = { FLIGHT: 'flight', TRAIN: 'train', BUS: 'bus', FERRY: 'ferry', CAR: 'car' };

  if (!/^[A-Za-z0-9]{16,40}$/.test(id)) { fail('This link is not valid.'); return; }

  var open = document.getElementById('open');
  open.href = 'itinera://s/' + id;
  open.addEventListener('click', function () {
    // If the app isn't installed the scheme does nothing; fall back to the store page.
    setTimeout(function () { if (!document.hidden) location.href = '/get'; }, 1600);
  });

  fetch('https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents/sharedItineraries/' + id)
    .then(function (r) { if (!r.ok) throw new Error('nf'); return r.json(); })
    .then(function (doc) {
      var d = val({ mapValue: { fields: doc.fields || {} } });
      document.title = (d.title || 'Itinerary') + ' — Itinera';
      root.className = ''; root.textContent = '';
      if (d.coverImageUrl && /^https:\/\/images\.unsplash\.com\//.test(d.coverImageUrl)) {
        var img = el('img', 'cover'); img.src = d.coverImageUrl; img.alt = ''; root.appendChild(img);
      }
      root.appendChild(el('h1', '', d.title || 'Itinerary'));
      var days = d.days || [], nDays = days.reduce(function (m, x) { return Math.max(m, x.dayNumber || 0); }, 0);
      var chips = el('div', 'chips');
      (d.countries || []).forEach(function (c) { chips.appendChild(el('span', 'chip', c)); });
      if (nDays) chips.appendChild(el('span', 'chip', nDays + (nDays === 1 ? ' day' : ' days')));
      if (LABELS[d.budgetTier]) chips.appendChild(el('span', 'chip', LABELS[d.budgetTier]));
      if (LABELS[d.paceTag]) chips.appendChild(el('span', 'chip', LABELS[d.paceTag]));
      root.appendChild(chips);
      if (d.description) root.appendChild(el('p', 'desc', d.description));
      var legs = d.legs || [];
      days.sort(function (a, b) { return (a.dayNumber || 0) - (b.dayNumber || 0); }).forEach(function (day) {
        root.appendChild(el('h2', '', 'Day ' + day.dayNumber));
        legs.filter(function (l) { return l.dayNumber === day.dayNumber; }).forEach(function (l) {
          root.appendChild(el('div', 'leg', '→ ' + (l.fromCity || '') + ' to ' + (l.toCity || '') + ' by ' + (MODE[l.transport] || 'transport')));
        });
        (day.stops || []).forEach(function (s) {
          var row = el('div', 'stop');
          row.appendChild(el('div', 'time', s.time || ''));
          var body = el('div');
          body.appendChild(el('div', 'stop-title', s.title || ''));
          if (s.location) body.appendChild(el('div', 'stop-loc', s.location));
          row.appendChild(body); root.appendChild(row);
        });
      });
      root.appendChild(el('p', 'note', 'Shared from Itinera. Only places and general details are included — never dates, names, notes or booking information.'));
      document.getElementById('bar').hidden = false;
    })
    .catch(function () { fail('This itinerary is no longer available.'); });
})();
</script>
</body>
</html>

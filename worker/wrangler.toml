name = "nera"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Nera's shared logic (../functions/tools.js) uses node:crypto for its cache keys.
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "itinera-ae020"
# Free tier: this many trips can be created with Nera before the subscription is needed, and whether that is
# enforced. Leave enforcement off until an in-app purchase exists to unlock Nera; trips are counted either way.
FREE_TRIPS = "3"
PAYWALL_ENABLED = "true"
# Fair-use caps: Nera requests per month. Paying and friends-and-family users get the higher one; the free tier's
# lower cap keeps the cost of users who never subscribe bounded.
PAID_MONTHLY_LIMIT = "150"
FREE_MONTHLY_LIMIT = "60"

# Daily quota + place-search cache. Run `npx wrangler d1 create nera`, then paste the printed
# database_id below and apply migrations (see worker/README.md).
[[d1_databases]]
binding = "DB"
database_name = "nera"
database_id = "f259701c-e388-4520-9996-44cadc650d97"
migrations_dir = "migrations"

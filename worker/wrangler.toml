name = "nera"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Nera's shared logic (../functions/tools.js) uses node:crypto for its cache keys.
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "itinera-ae020"
# Free trial (days from a user's first Nera request) and whether it is enforced. Leave enforcement off until an
# in-app purchase exists to unlock Nera; the trial start is recorded either way.
TRIAL_DAYS = "7"
PAYWALL_ENABLED = "true"
# Fair-use cap: Nera requests per month for paying and friends-and-family users.
PAID_MONTHLY_LIMIT = "150"

# Daily quota + place-search cache. Run `npx wrangler d1 create nera`, then paste the printed
# database_id below and apply migrations (see worker/README.md).
[[d1_databases]]
binding = "DB"
database_name = "nera"
database_id = "f259701c-e388-4520-9996-44cadc650d97"
migrations_dir = "migrations"
